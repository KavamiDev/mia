{% extends "base.html" %}
{% block title %}{{ 'Modifier' if restaurant else 'Nouveau' }} restaurant{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">
    {{ 'Modifier le restaurant' if restaurant else 'Nouveau restaurant' }}
  </h2>

  <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-5">
    <div class="grid grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
        <input type="text" name="nom" value="{{ restaurant.nom if restaurant else '' }}" required
               class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone restaurateur</label>
        <input type="text" name="telephone" value="{{ restaurant.telephone if restaurant else '' }}" required
               placeholder="+33692..."
               class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
      <input type="text" name="adresse" value="{{ restaurant.adresse or '' if restaurant else '' }}"
             class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Horaires</label>
      <input type="text" name="horaires" value="{{ restaurant.horaires or '' if restaurant else '' }}"
             placeholder="Lun-Sam 12h-14h, 19h-22h"
             class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Numéro Telnyx (appels entrants, E.164)</label>
      <input type="text" name="incoming_phone_number" value="{{ restaurant.incoming_phone_number or '' if restaurant else '' }}"
             placeholder="+33..."
             class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
    </div>

    <div class="grid grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Quota réservations / jour</label>
        <input type="number" name="quota_reservations" value="{{ restaurant.quota_reservations or '' if restaurant else '' }}"
               placeholder="Illimité si vide"
               class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Quota commandes / jour</label>
        <input type="number" name="quota_commandes" value="{{ restaurant.quota_commandes or '' if restaurant else '' }}"
               placeholder="Illimité si vide"
               class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
      </div>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <button type="submit"
              class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors">
        {{ 'Enregistrer' if restaurant else 'Créer' }}
      </button>
      <a href="/dashboard/restaurants" class="text-sm text-gray-500 hover:text-gray-700">Annuler</a>
      {% if restaurant %}
      <a href="/dashboard/restaurants/{{ restaurant.id }}/menu" class="ml-auto text-sm text-indigo-600 hover:underline">Gérer le menu →</a>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
