<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MIA{% endblock %} — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: '#6366f1' } } }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <nav class="w-56 bg-gray-900 text-white flex flex-col shrink-0">
      <div class="p-5 border-b border-gray-700">
        <h1 class="text-xl font-bold tracking-tight">MIA</h1>
        <p class="text-xs text-gray-400 mt-1">Dashboard admin</p>
      </div>
      <div class="flex-1 py-4 space-y-1 px-3">
        <a href="/dashboard/restaurants" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 {% if active == 'restaurants' %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          Restaurants
        </a>
        <a href="/dashboard/reservations" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 {% if active == 'reservations' %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Réservations
        </a>
        <a href="/dashboard/commandes" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 {% if active == 'commandes' %}bg-gray-800 text-white{% else %}text-gray-300{% endif %}">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          Commandes
        </a>
      </div>
      <div class="p-3 border-t border-gray-700">
        <a href="/dashboard/logout" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Déconnexion
        </a>
      </div>
    </nav>
    <!-- Content -->
    <main class="flex-1 p-8">
      {% if flash %}
      <div class="mb-6 px-4 py-3 rounded-lg text-sm {% if flash_type == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
        {{ flash }}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
